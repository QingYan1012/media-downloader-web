<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 420px; margin: 12px; font-size: 13px; }
    h1 { font-size: 15px; margin: 0 0 6px; }
    .item { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .item input { margin-top: 3px; }
    .url { word-break: break-all; color: #374151; flex: 1; font-size: 11px; max-height: 2.8em; overflow: hidden; }
    .kind { font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .kind.video { color: #2563eb; }
    .kind.audio { color: #16a34a; }
    .kind.hls, .kind.dash { color: #c026d3; }
    button { margin-top: 6px; margin-right: 6px; padding: 6px 10px; cursor: pointer; }
    .empty { color: #9ca3af; line-height: 1.5; }
    .hint { color: #6b7280; font-size: 12px; margin-bottom: 8px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; align-items: center; }
    #list { max-height: 360px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>媒体嗅探 → 本机下载器</h1>
  <div class="hint">需本机已启动下载器（:8765）。先播放几秒再刷新。通用站抓 m3u8/mp4/ts；B站勾选 1 视频+1 音频 m4s。</div>
  <div class="toolbar">
    <button type="button" id="selAll">全选</button>
    <button type="button" id="selNone">取消全选</button>
    <button type="button" id="selSmart">智能勾选(B站)</button>
  </div>
  <div id="list" class="empty">扫描中…</div>
  <div>
    <button id="send">发送选中到下载器</button>
    <button id="refresh">刷新</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
