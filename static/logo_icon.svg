<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="MediaDownloader">
  <defs>
    <linearGradient id="waveGradIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- rounded app tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <!-- waveform -->
  <path
    d="M28 72
       C36 72 38 58 46 58
       C54 58 56 78 64 78
       C72 78 74 52 84 52
       C94 52 96 70 104 68"
    stroke="url(#waveGradIcon)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- small end dot -->
  <circle cx="108" cy="67" r="3.5" fill="#3b82f6"/>
</svg>
