version: "3.8"
services:
  mediadownloader:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./Downloads:/app/Downloads
      - ./cookies:/app/cookies
      - ./tools:/app/tools
      - ./plugins:/app/plugins
      - ./config.json:/app/config.json
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # 可选：启用后在设置里填 rpc http://aria2:6800/jsonrpc
  aria2:
    image: p3terx/aria2-pro
    profiles: ["aria2"]
    environment:
      - RPC_SECRET=media_dl
      - RPC_PORT=6800
    volumes:
      - ./Downloads:/downloads
    ports:
      - "6800:6800"
    restart: unless-stopped
